<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mech RTS">
<meta name="theme-color" content="#0b1015">
<!-- Must match VERSION in src/version.js. If they differ, the HUD warns that Safari served stale code. -->
<meta name="build" content="v2">
<title>Mech RTS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-180.png">
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#0b1015; overscroll-behavior:none; }
  body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color:#e8eef2;
         -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
         -webkit-tap-highlight-color: transparent; touch-action:none; }
  #view { position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  .panel { background:rgba(14,20,26,.78); border:1px solid rgba(160,200,230,.25); border-radius:10px; }
  .btn { min-width:50px; height:44px; padding:0 12px; font-size:14px; font-weight:600; color:#e8eef2;
         background:rgba(30,44,58,.9); border:1px solid rgba(160,200,230,.35); border-radius:10px;
         display:flex; align-items:center; justify-content:center; touch-action:none; cursor:pointer; }
  .btn:active { background:rgba(60,90,120,.95); }
  .btn.on { background:rgba(40,90,60,.95); border-color:#7cff9a; }
  #topright { position:fixed; top:calc(env(safe-area-inset-top) + 10px); right:calc(env(safe-area-inset-right) + 12px);
              display:flex; gap:8px; }
  #debug { position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:calc(env(safe-area-inset-left) + 12px);
           padding:8px 12px; font:12px/1.5 ui-monospace, Menlo, monospace; pointer-events:none; display:none;
           white-space:pre; }
  #ver { position:fixed; right:calc(env(safe-area-inset-right) + 10px); bottom:calc(env(safe-area-inset-bottom) + 6px);
         font-size:12px; color:rgba(255,255,255,.55); pointer-events:none; }
  #ver.stale { color:#ff8a70; font-weight:700; }
  #fatal { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:24px;
           background:rgba(6,10,14,.92); text-align:center; font-size:16px; line-height:1.5; }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="debug" class="panel"></div>
<div id="topright">
  <div class="btn" id="btnDebug" title="Debug overlay (`)">FPS</div>
</div>
<div id="ver">v2</div>
<div id="fatal"></div>
<script>
  // Block page zoom / scroll / callouts during play (Safari ignores user-scalable=no in some cases).
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) {
    document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  }
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {          // stop double-tap zoom
    const now = Date.now();
    if (now - lastTouchEnd < 350) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
  // Show load errors on screen, since there is no console on the iPad.
  window.addEventListener('error', e => {
    const f = document.getElementById('fatal');
    f.style.display = 'flex';
    f.textContent = 'Error: ' + (e.message || e.error || 'failed to load') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
  });
</script>
<script type="module" src="src/main.js?v=2"></script>
</body>
</html>
