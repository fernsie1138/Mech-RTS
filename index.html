<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mech RTS">
<meta name="theme-color" content="#0b1015">
<!-- Must match VERSION in src/version.js. If they differ, the HUD warns that Safari served stale code. -->
<meta name="build" content="v6">
<title>Mech RTS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css?v=6">
<style>
  #topright { position:fixed; top:calc(env(safe-area-inset-top) + 10px); right:calc(env(safe-area-inset-right) + 12px);
              display:flex; gap:8px; }
  #fire { position:fixed; bottom:calc(env(safe-area-inset-bottom) + 12px); left:50%; transform:translateX(-50%);
          display:flex; gap:8px; padding:8px; align-items:center; }
  #fire .lbl { font-size:13px; color:#b9c7d2; padding:0 4px 0 6px; }
  #fire .sep { width:1px; align-self:stretch; background:rgba(160,200,230,.25); margin:0 2px; }
  #mapname { position:fixed; top:calc(env(safe-area-inset-top) + 10px); left:50%; transform:translateX(-50%);
             padding:6px 14px; font-size:14px; font-weight:600; pointer-events:none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js?v=6",
    "./editor/editor.js": "./editor/editor.js?v=6",
    "./editor/history.js": "./editor/history.js?v=6",
    "./editor/tools/features.js": "./editor/tools/features.js?v=6",
    "./editor/tools/markers.js": "./editor/tools/markers.js?v=6",
    "./editor/tools/terrain.js": "./editor/tools/terrain.js?v=6",
    "./src/combat/damage.js": "./src/combat/damage.js?v=6",
    "./src/combat/effects.js": "./src/combat/effects.js?v=6",
    "./src/config.js": "./src/config.js?v=6",
    "./src/main.js": "./src/main.js?v=6",
    "./src/maps/format.js": "./src/maps/format.js?v=6",
    "./src/maps/imageimport.js": "./src/maps/imageimport.js?v=6",
    "./src/maps/loader.js": "./src/maps/loader.js?v=6",
    "./src/terrain/chunks.js": "./src/terrain/chunks.js?v=6",
    "./src/terrain/heightfield.js": "./src/terrain/heightfield.js?v=6",
    "./src/terrain/surface.js": "./src/terrain/surface.js?v=6",
    "./src/terrain/testmap.js": "./src/terrain/testmap.js?v=6",
    "./src/terrain/water.js": "./src/terrain/water.js?v=6",
    "./src/terrain/watermesh.js": "./src/terrain/watermesh.js?v=6",
    "./src/ui/camera.js": "./src/ui/camera.js?v=6",
    "./src/ui/debug.js": "./src/ui/debug.js?v=6",
    "./src/version.js": "./src/version.js?v=6",
    "./src/view.js": "./src/view.js?v=6",
    "./src/world/forest.js": "./src/world/forest.js?v=6",
    "./src/world/markers.js": "./src/world/markers.js?v=6",
    "./src/world/trees.js": "./src/world/trees.js?v=6"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="debug" class="panel"></div>
<div id="mapname" class="panel"></div>
<div id="topright">
  <div class="btn" id="btnEditor">Editor</div>
  <div class="btn" id="btnDebug" title="Debug overlay (`)">FPS</div>
</div>
<div id="fire" class="panel">
  <span class="lbl">Tap to fire</span>
  <div class="btn" data-weapon="mg">MG</div>
  <div class="btn" data-weapon="cannon">Cannon</div>
  <div class="btn" data-weapon="shell">Shell</div>
  <div class="sep"></div>
  <div class="btn" id="btnBarrage">Barrage</div>
  <div class="btn" id="btnReset">Reset</div>
</div>
<div id="ver">v6</div>
<div id="loading">Loading map…</div>
<div id="fatal"></div>
<script src="src/ui/page.js?v=6"></script>
<script type="module" src="src/main.js?v=6"></script>
</body>
</html>
